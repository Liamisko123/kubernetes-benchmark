- name: Sleep
  measurements:
  - Identifier: sleep
    Method: Sleep
    Params:
      duration: {{$duration}}

- name: Gather measurements global
  measurements:
  - Identifier: gq_all
    Method: GenericPrometheusQuery
    Params:
      action: gather
      enableViolations: true
