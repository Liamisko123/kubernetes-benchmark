      - name: avg_temp_pi1
        query: avg(avg_over_time(node_hwmon_temp_celsius{instance="192.168.137.10:9100", sensor="temp1", chip="thermal_thermal_zone0"}[%v]))
      - name: avg_cpu_clock_pi1
        query: avg(avg_over_time(node_cpu_scaling_frequency_hertz{instance="192.168.137.10:9100"}[%v]))

