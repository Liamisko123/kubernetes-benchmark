      - name: avg_mem_pi1
        query: avg(avg_over_time((node_memory_MemTotal_bytes{instance="192.168.137.10:9100"} - node_memory_MemAvailable_bytes{instance="192.168.137.10:9100"})[%v:15s])) / 1024 / 1024
      - name: avg_disk_space_pi1
        query: avg(increase(node_disk_written_bytes_total{instance="192.168.137.10:9100"}[%v])) / 1024 / 1024
      - name: avg_disk_latency_pi1
