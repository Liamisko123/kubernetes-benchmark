apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Name}}
spec:
  serviceName: {{.Name}}
  replicas: {{.ReplicasMin}}
  selector:
    matchLabels:
      app: {{.Name}}
  template:
    metadata:
      labels:
        app: {{.Name}}
    spec:
      containers:
      - name: app
        image: {{.Image}}
        command: ["/pause"]