apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Name}}
  labels:
    group: load
spec:
  podManagementPolicy: Parallel
  serviceName: {{.Name}}
  replicas: {{.ReplicasMin}}
  selector:
    matchLabels:
      app: {{.Name}}
      group: load
  template:
    metadata:
      labels:
        app: {{.Name}}
        group: load
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: app
        image: {{.Image}}
        volumeMounts:
        - name: storage
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 1Gi